  <!-- Razorpay Official Checkout Script -->
  <!-- Razorpay Official Checkout Script -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    function showSimulatedPaymentModal(amountPaise, orderId, callbackSuccess, callbackDismiss) {
      var existing = document.getElementById('rzp-sim-overlay');
      if (existing) existing.remove();

      var overlay = document.createElement('div');
      overlay.id = 'rzp-sim-overlay';
      overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.7);backdrop-filter:blur(8px);z-index:999999;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px;box-sizing:border-box;';

      var rupeeAmount = (amountPaise / 100).toFixed(2);
      overlay.innerHTML = 
        '<div style="background:#ffffff;border-radius:24px;width:100%;max-width:390px;box-shadow:0 25px 50px -12px rgba(15,23,42,0.35);overflow:hidden;animation:rzpFadeIn 0.25s ease-out;">' +
          '<div style="background:linear-gradient(135deg,#020617 0%,#1e1b4b 50%,#4338ca 100%);padding:28px 24px;color:#fff;text-align:center;">' +
            '<div style="display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.12);padding:6px 16px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:0.5px;margin-bottom:14px;color:#a5b4fc;border:1px solid rgba(255,255,255,0.15);">' +
              '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#38bdf8;box-shadow:0 0 8px #38bdf8;"></span>' +
              'RAZORPAY TEST GATEWAY' +
            '</div>' +
            '<div style="font-size:36px;font-weight:800;letter-spacing:-0.5px;color:#ffffff;line-height:1.1;">₹' + rupeeAmount + '</div>' +
            '<div style="font-size:12px;color:#cbd5e1;margin-top:6px;font-family:monospace;letter-spacing:0.3px;">Order #' + orderId + '</div>' +
          '</div>' +
          '<div style="padding:24px;">' +
            '<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;padding:14px 16px;margin-bottom:20px;">' +
              '<div style="display:flex;justify-content:space-between;font-size:13px;color:#64748b;margin-bottom:8px;">' +
                '<span>Station Hub</span>' +
                '<span style="font-weight:700;color:#0f172a;">Autonomous Print Station</span>' +
              '</div>' +
              '<div style="display:flex;justify-content:space-between;font-size:13px;color:#64748b;margin-bottom:8px;">' +
                '<span>Payment Channel</span>' +
                '<span style="font-weight:700;color:#0f172a;">UPI / QR / Instant Card</span>' +
              '</div>' +
              '<div style="display:flex;justify-content:space-between;font-size:13px;color:#64748b;">' +
                '<span>Sandbox Environment</span>' +
                '<span style="font-weight:700;color:#10b981;">Online & Authorized</span>' +
              '</div>' +
            '</div>' +
            '<button id="rzp-sim-success-btn" style="width:100%;background:linear-gradient(135deg,#2563eb 0%,#1d4ed8 100%);color:#fff;border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 14px rgba(37,99,235,0.35);margin-bottom:12px;transition:transform 0.15s ease;">' +
              '<span>Simulate Successful Payment</span>' +
              '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>' +
            '</button>' +
            '<button id="rzp-sim-cancel-btn" style="width:100%;background:#f1f5f9;color:#64748b;border:none;border-radius:14px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;">' +
              'Cancel Transaction' +
            '</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(overlay);

      document.getElementById('rzp-sim-success-btn').onclick = function() {
        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        var mockPayId = "pay_test_" + Math.random().toString(36).substring(2, 10);
        var mockSig = "sim_sig_" + Date.now();
        console.log("[RAZORPAY_JS] Simulated test payment authorized:", mockPayId);
        if (callbackSuccess) callbackSuccess(mockPayId, orderId, mockSig);
      };

      document.getElementById('rzp-sim-cancel-btn').onclick = function() {
        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        if (callbackDismiss) callbackDismiss("DISMISSED");
      };
    }

    window.openRazorpayModal = function(keyId, orderId, amountPaise, callbackSuccess, callbackDismiss) {
      var safeKey = (keyId && String(keyId).trim().length > 0) ? String(keyId).trim() : "rzp_test_RFxhjAiTxwrpAJ";
      console.log("[RAZORPAY_JS] openRazorpayModal invoked: key=", safeKey, "orderId=", orderId, "amountPaise=", amountPaise);

      var options = {
        key: safeKey,
        amount: amountPaise,
        currency: "INR",
        name: "Autonomous Printer",
        description: "Self-Service Print Order",
        order_id: orderId,
        prefill: {
          name: "Autonomous Student",
          email: "student@printstation.edu",
          contact: "9876543210"
        },
        theme: {
          color: "#4F46E5"
        },
        handler: function(response) {
          console.log("[RAZORPAY_JS] Payment Success Response:", response);
          if (callbackSuccess) {
            callbackSuccess(
              response.razorpay_payment_id || "",
              response.razorpay_order_id || "",
              response.razorpay_signature || ""
            );
          }
        },
        modal: {
          ondismiss: function() {
            console.warn("[RAZORPAY_JS] Checkout Modal Dismissed by user");
            if (callbackDismiss) {
              callbackDismiss("DISMISSED");
            }
          }
        }
      };

      if (typeof Razorpay !== 'undefined') {
        try {
          console.log("[RAZORPAY_JS] Launching official Razorpay checkout...");
          var rzp = new Razorpay(options);
          rzp.open();
          return;
        } catch (err) {
          console.warn("[RAZORPAY_JS] Razorpay initialization failed, using sandbox fallback:", err);
          showSimulatedPaymentModal(amountPaise, orderId, callbackSuccess, callbackDismiss);
          return;
        }
      }

      // If Razorpay SDK is not ready yet, wait briefly or load dynamically
      console.log("[RAZORPAY_JS] Razorpay SDK loading or blocked by extension. Checking availability...");
      var attempts = 0;
      var interval = setInterval(function() {
        attempts++;
        if (typeof Razorpay !== 'undefined') {
          clearInterval(interval);
          try {
            var rzp = new Razorpay(options);
            rzp.open();
          } catch(e) {
            showSimulatedPaymentModal(amountPaise, orderId, callbackSuccess, callbackDismiss);
          }
        } else if (attempts >= 6) {
          clearInterval(interval);
          console.log("[RAZORPAY_JS] Showing Sandbox Test Gateway modal...");
          showSimulatedPaymentModal(amountPaise, orderId, callbackSuccess, callbackDismiss);
        }
      }, 300);
    };

    window.openKioskScreen = function(otp) {
      var url = "http://127.0.0.1:8000/kiosk" + (otp ? ("?otp=" + encodeURIComponent(otp)) : "");
      console.log("[KIOSK_JS] Opening Kiosk Touchscreen at:", url);
      window.open(url, "_blank");
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
