<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="frontend">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>frontend</title>
  <link rel="manifest" href="manifest.json">
  <!-- Razorpay Official Checkout Script -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    window.openRazorpayModal = function(keyId, orderId, amountPaise, callbackSuccess, callbackDismiss) {
      var safeKey = (keyId && String(keyId).trim().length > 0) ? String(keyId).trim() : "rzp_test_RFxhjAiTxwrpAJ";
      console.log("[RAZORPAY_JS] openRazorpayModal called with key:", safeKey, "orderId:", orderId, "amountPaise:", amountPaise);

      if (typeof Razorpay === 'undefined') {
        console.error("[RAZORPAY_JS] Razorpay SDK not loaded");
        if (callbackDismiss) callbackDismiss("SCRIPT_NOT_LOADED");
        return;
      }
      var options = {
        key: safeKey,
        amount: amountPaise,
        currency: "INR",
        name: "AutosPrint Hub",
        description: "Instant Print Payment",
        order_id: orderId,
        prefill: {
          name: "Autonomous Student",
          email: "student@printstation.edu",
          contact: "9876543210"
        },
        theme: {
          color: "#2563EB"
        },
        handler: function(response) {
          console.log("[RAZORPAY_JS] Payment Success Response:", response);
          if (callbackSuccess) {
            callbackSuccess(
              response.razorpay_payment_id || "",
              response.razorpay_order_id || "",
              response.razorpay_signature || ""
            );
          }
        },
        modal: {
          ondismiss: function() {
            console.warn("[RAZORPAY_JS] Checkout Modal Dismissed by user");
            if (callbackDismiss) {
              callbackDismiss("DISMISSED");
            }
          }
        }
      };
      try {
        console.log("[RAZORPAY_JS] Initializing new Razorpay instance with options:", options);
        var rzp = new Razorpay(options);
        rzp.open();
      } catch (err) {
        console.error("[RAZORPAY_JS] Razorpay open exception:", err);
        if (callbackDismiss) callbackDismiss("LAUNCH_ERROR: " + err);
      }
    };

    window.openKioskScreen = function(otp) {
      var url = "http://127.0.0.1:8000/kiosk" + (otp ? ("?otp=" + encodeURIComponent(otp)) : "");
      console.log("[KIOSK_JS] Opening Kiosk Touchscreen at:", url);
      window.open(url, "_blank");
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
