# Replace hostname, paths and TLS certificates before installation.
server {
    listen 80;
    server_name print.example.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name print.example.edu;
    ssl_certificate /etc/letsencrypt/live/print.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/print.example.edu/privkey.pem;
    root /opt/achuppori/frontend/build/web;
    index index.html;
    client_max_body_size 55m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8000;
    }
    location /local/ { return 410; }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
