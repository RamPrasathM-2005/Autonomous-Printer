name: autonomous_printer
description: "Smart Self-Service Autonomous Printing Platform - Flutter Mobile Client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Networking & HTTP
  dio: ^5.4.1
  http: ^1.2.1
  connectivity_plus: ^6.0.3

  # File Handling
  file_picker: ^8.0.0+1
  path_provider: ^2.1.2
  path: ^1.9.0

  # UI, Icons, Fonts & Styling
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  uuid: ^4.3.3

  # Storage & Persistence
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
